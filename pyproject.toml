[project]
name = "pgnreader"
version = "1.1.0"
description = "Offline PGN reader and study interface (local-only)"
requires-python = ">=3.11"
dependencies = [
    "chess>=1.11,<2",
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pgnreader"]
